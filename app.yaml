apiVersion: v1
kind: Pod
metadata:
  name: gdx-app-pod
  labels:
    app: gdx-app
spec:
  containers:
    - name: gdx-container
      image: nvcr.io/nvidia/pytorch:26.10-py3
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c"]
      args:
        - |
          jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root &
          python3 -m http.server 8080
      ports:
        - name: jupyter-port
          containerPort: 8888
          protocol: TCP
        - name: api-port
          containerPort: 8080
          protocol: TCP
      resources:
        requests:
          memory: "18Gi"
          cpu: "4"
          nvidia.com/gpu: "1"
        limits:
          memory: "18Gi"
          cpu: "4"
          nvidia.com/gpu: "1"
      securityContext:
        capabilities:
          add: ["SYS_PTRACE"]
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 18Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gdx-app-service
  labels:
    app: gdx-app
spec:
  type: NodePort
  selector:
    app: gdx-app
  ports:
    - name: jupyter-svc
      port: 8888
      targetPort: 8888
      protocol: TCP
